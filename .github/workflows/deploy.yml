name: Deploy to prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to prod (JWT)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          echo "$SF_JWT_KEY" | base64 --decode > server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID_PROD }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME_PROD }}" \
            --alias prod
          rm -f server.key

      - name: Check-only validate (runs all local tests)
        id: validate
        run: |
          sf project deploy validate --source-dir force-app --target-org prod \
            --test-level RunLocalTests --wait 30 --json > validate.json
          cat validate.json
          echo "job_id=$(jq -r '.result.id' validate.json)" >> "$GITHUB_OUTPUT"

      - name: Quick deploy the validated job
        run: |
          sf project deploy quick --job-id "${{ steps.validate.outputs.job_id }}" \
            --target-org prod --wait 10

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deploy to prod"
            echo "- Validation job: \`${{ steps.validate.outputs.job_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
